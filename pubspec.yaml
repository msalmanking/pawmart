name: pawmart_app
description: PawMart — full pet-shop app UI (Riverpod, animated splash/onboarding, 22 screens)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.5.0 
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
